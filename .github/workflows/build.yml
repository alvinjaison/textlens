name: Build macOS Application

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    permissions:
      contents: write  # for creating releases
      actions: read    # for workflow access
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    
    - name: Install dependencies
      run: |
        go mod download
        go mod verify
    
    - name: Build macOS binary (ARM64)
      run: |
        mkdir -p build
        go build -ldflags="-s -w" -o build/textlens-darwin-arm64 .
    
    - name: Build macOS binary (AMD64)
      run: |
        GOARCH=amd64 go build -ldflags="-s -w" -o build/textlens-darwin-amd64 .
    
    - name: Create .app bundle
      run: |
        APP_NAME="TextLens"
        VERSION="${GITHUB_REF_NAME#v}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
          VERSION="1.0.0"
        fi
        
        # Create app bundle structure
        mkdir -p "build/${APP_NAME}.app/Contents/MacOS"
        mkdir -p "build/${APP_NAME}.app/Contents/Resources"
        
        # Copy ARM64 binary (primary target for Apple Silicon)
        cp build/textlens-darwin-arm64 "build/${APP_NAME}.app/Contents/MacOS/textlens"
        chmod +x "build/${APP_NAME}.app/Contents/MacOS/textlens"
        
        # Create Info.plist
        ./scripts/create-plist.sh "build/${APP_NAME}.app/Contents/Info.plist" "$VERSION"
        
        # Create icon
        ./scripts/create-icon.sh "build/${APP_NAME}.app/Contents/Resources/AppIcon.icns"
    
    - name: Create DMG
      run: |
        APP_NAME="TextLens"
        VERSION="${GITHUB_REF_NAME#v}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
          VERSION="1.0.0"
        fi
        
        mkdir -p dist
        
        # Create temporary directory for DMG contents
        DMG_TEMP=$(mktemp -d)
        cp -R "build/${APP_NAME}.app" "$DMG_TEMP/"
        ln -s /Applications "$DMG_TEMP/Applications"
        
        # Create DMG
        hdiutil create -volname "$APP_NAME" -srcfolder "$DMG_TEMP" -ov -format UDZO "dist/${APP_NAME}-${VERSION}.dmg"
        
        # Cleanup
        rm -rf "$DMG_TEMP"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: macos-binaries
        path: |
          build/textlens-darwin-arm64
          build/textlens-darwin-amd64
          build/TextLens.app
    
    - name: Upload DMG
      uses: actions/upload-artifact@v3
      with:
        name: macos-installer
        path: dist/*.dmg
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/*.dmg
          build/textlens-darwin-arm64
          build/textlens-darwin-amd64
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read  # for checking out code
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    
    - name: Install dependencies
      run: |
        go mod download
        go mod verify
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Code is not formatted. Please run 'go fmt ./...'"
          gofmt -s -l .
          exit 1
        fi
